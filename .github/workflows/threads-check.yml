name: threads-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          echo "::add-mask::$T"
          B="https://graph.threads.net/v1.0"

          echo "== 1. トークンは有効か =="
          code=$(curl -s -o /tmp/me.json -w "%{http_code}" "$B/me?fields=username&access_token=$T")
          echo "status: $code"
          jq -r '.username // .error.message' /tmp/me.json

           echo "== 2. 自分の投稿は読めるか =="
          curl -s "$B/me/threads?fields=id&limit=5&access_token=$T" | jq -r '"件数: \((.data // []) | length)", (.error.message // empty)'
          
          echo "== 3. キーワード検索は他人の投稿も返すか =="
          curl -s -G "$B/keyword_search" \
            --data-urlencode "q=観測センター" \
            --data-urlencode "search_type=RECENT" \
            --data-urlencode "fields=username" \
            --data-urlencode "limit=10" \
            --data-urlencode "access_token=$T" \
            | jq -r '(.data // [] | map(.username) | unique | join(",")), (.error.message // empty)'
