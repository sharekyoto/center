name: threads-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          echo "::add-mask::$T"
          B="https://graph.threads.net/v1.0"

          echo "== 1. トークンは有効か =="
          code=$(curl -s -o /tmp/me.json -w "%{http_code}" "$B/me?fields=username&access_token=$T")
          echo "status: $code"
          jq -r '.username // .error.message // "不明な応答"' /tmp/me.json || cat /tmp/me.json

          echo "== 2. 自分の投稿は読めるか =="
          curl -s "$B/me/threads?fields=id&limit=5&access_token=$T" > /tmp/own.json
          jq -r '"件数: \((.data // []) | length)"' /tmp/own.json || cat /tmp/own.json
          jq -r '.error.message // empty' /tmp/own.json || true

          echo "== 3. キーワード検索で返るユーザー名 =="
          curl -s -G "$B/keyword_search" \
            --data-urlencode "q=観測センター" \
            --data-urlencode "search_type=RECENT" \
            --data-urlencode "fields=username" \
            --data-urlencode "limit=10" \
            --data-urlencode "access_token=$T" > /tmp/search.json
          jq -r '"ユーザー名: \(((.data // []) | map(.username) | unique | join(",")))"' /tmp/search.json || cat /tmp/search.json
          jq -r '.error.message // empty' /tmp/search.json || true
