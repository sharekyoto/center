name: threads-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          set +e
          echo "::add-mask::$T"
          B="https://graph.threads.net/v1.0"

          search () {
            echo "== 検索: $1 =="
            curl -s -m 30 -G -o /tmp/s.txt -w "http: %{http_code}\n" "$B/keyword_search" \
              --data-urlencode "q=$1" \
              --data-urlencode "search_type=RECENT" \
              --data-urlencode "fields=username" \
              --data-urlencode "limit=25" \
              --data-urlencode "access_token=$T"
            echo "ユーザー名の集計:"
            grep -o '"username":"[^"]*"' /tmp/s.txt | sort | uniq -c
            grep -o '"message":"[^"]*"' /tmp/s.txt | head -n 1
          }

          search "komorebi"
          search "木漏れ日"
          search "chasinglight"

          exit 0
