name: threads-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          set +e
          echo "::add-mask::$T"
          B="https://graph.threads.net/v1.0"

          echo "== 自分の投稿（新しい順・10件） =="
          curl -s -m 30 -G -o /tmp/own.json -w "http: %{http_code}\n" "$B/me/threads" \
            --data-urlencode "fields=timestamp,media_type,is_quote_post,text" \
            --data-urlencode "limit=10" \
            --data-urlencode "access_token=$T"

          echo "時刻 / 種類 / 引用か / 本文の冒頭40字"
          jq -r '(.data // [])[] | [.timestamp, .media_type, (.is_quote_post | tostring), ((.text // "")[0:40])] | @tsv' /tmp/own.json
          jq -r '.error.message // empty' /tmp/own.json

          exit 0
