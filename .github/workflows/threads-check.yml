name: threads-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          set +e
          echo "::add-mask::$T"
          B="https://graph.threads.net/v1.0"

          echo "== 0. トークンの長さ（中身は出しません） =="
          echo "length: ${#T}"

          echo "== 1. /me =="
          curl -s -m 30 -w "\nhttp: %{http_code}\n" "$B/me?fields=id,username&access_token=$T" | head -c 800
          echo "curl exit: ${PIPESTATUS[0]}"

          echo "== 2. 自分の投稿 =="
          curl -s -m 30 -w "\nhttp: %{http_code}\n" "$B/me/threads?fields=id&limit=3&access_token=$T" | head -c 800
          echo "curl exit: ${PIPESTATUS[0]}"

          echo "== 3. キーワード検索 =="
          curl -s -m 30 -G -w "\nhttp: %{http_code}\n" "$B/keyword_search" \
            --data-urlencode "q=観測センター" \
            --data-urlencode "search_type=RECENT" \
            --data-urlencode "fields=username" \
            --data-urlencode "limit=10" \
            --data-urlencode "access_token=$T" | head -c 1500
          echo "curl exit: ${PIPESTATUS[0]}"

          exit 0
