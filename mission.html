<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>本日の業務 ／ 発酵都市観測センター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<!--
  wiki の /start に三枚の iframe で埋める。?m=word（記述待ち）／ place（現状報告待ち）／ where（座標待ち）／ blank（未観測区画）。
  m を付けずに開くと三枚を縦に並べる。読むのは feed.json だけ。何も書き込まない。
  約束：実線＝もうある／破線＝まだ無い（あなたが埋める所）。三枚とも同じ文法で描く。
  座標の割りと平安京の呼び名は map.html（board.mjs）と同じ。片方だけ直さないこと。
-->
<style>
:root{
  --paper:#ffffff; --ground:#e9edee; --ink:#14171a; --muted:#5d686d; --faint:#8e999e;
  --rule:#d6dde0; --deep:#2f5d68; --deep-fill:rgba(47,93,104,.14); --alert:#b72922;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans);-webkit-text-size-adjust:100%}
body.solo{background:var(--ground);padding:12px}
body.solo .card{height:480px;max-width:560px;margin:0 auto 12px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--alert);outline-offset:2px}

.card{height:100vh;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;border:1px solid var(--rule);background:var(--paper);overflow:hidden}
.top{display:flex;align-items:baseline;gap:8px;font:11px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.top .no{color:var(--alert)}
.top{white-space:nowrap}
.top > span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:320px){.top .agl{display:none}.ttl{font-size:17px}}
.top .again{margin-left:auto;font:11px/1 var(--mono);letter-spacing:.08em;color:var(--muted);padding:6px 0 6px 10px}
.top .again:hover{color:var(--ink)}
.top .rec{font:11px/1 var(--mono);letter-spacing:.08em;color:var(--muted);padding:6px 0 6px 10px;text-decoration:underline;text-underline-offset:3px}
.top .again + .rec{padding-left:6px;margin-left:0}
.top .rec:hover{color:var(--ink)}
.top .rec:first-of-type{margin-left:auto}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.ttl{font-size:19px;font-weight:700;line-height:1.35;margin:0;letter-spacing:.02em}
.vis{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:10px}
.act{display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.06em;border:1px solid var(--ink)}
.btn:hover{background:#2a2f33}
.btn.sub{flex:0 0 auto;background:transparent;color:var(--ink)}
.btn.sub:hover{background:var(--ground)}

/* 実線＝ある／破線＝まだ無い */
.have{border:1px solid var(--deep)}
.void{border:2px dashed var(--faint)}

/* ① 写真に言葉 */
.shot{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:var(--ground)}
.slot{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 12px;color:var(--muted);text-decoration:none;font-size:15px;letter-spacing:.08em;text-align:center}
.slot:hover{color:var(--ink);border-color:var(--ink)}
.said{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{font-size:12px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex b{font:10px var(--mono);letter-spacing:.1em;color:var(--faint);font-weight:400;margin-right:6px}
.top .verb{font:700 13px/1 var(--sans);letter-spacing:.08em;color:var(--ink)}

/* ② 言葉から場所 */
.quote{margin:0;font-size:16px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.frame{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.frame .code{font:700 40px/1 var(--mono);letter-spacing:.04em}
.frame .code small{font-size:18px;color:var(--muted);margin-left:2px}
.frame .name{font-size:13px;color:var(--muted);letter-spacing:.1em}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.frame.open{border:1px solid var(--deep)}
.frame.open img{display:block}
.peek{position:absolute;right:8px;bottom:8px;z-index:1;font:11px/1 var(--mono);letter-spacing:.06em;background:var(--paper);border:1px solid var(--rule);padding:6px 8px;color:var(--muted)}
.peek:hover{color:var(--ink)}

/* ④ 空白の区画 */
.gridwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{position:relative}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;width:100%;height:100%}
.cell{position:relative;display:block;border:1.5px dashed var(--faint);background:transparent}
.cell.seen{border:1px solid var(--deep);background:var(--deep-fill)}
.cell:hover{border-color:var(--ink)}
.cell.pick{border:2px solid var(--alert);background:rgba(183,41,34,.06)}
.cell.hint{animation:call 1.6s ease-in-out 3}
a.cell{position:relative;text-decoration:none;color:var(--muted)}
a.cell .cc{position:absolute;left:3px;top:2px;font:9px/1 var(--mono);letter-spacing:.02em}
a.cell .cn{position:absolute;right:3px;bottom:2px;font:700 10px/1 var(--mono);color:var(--alert)}
a.cell.seen{color:var(--deep)}
a.where .cnt,.where a.cnt{color:var(--deep)}
@keyframes call{50%{background:rgba(183,41,34,.22)}}
@media (prefers-reduced-motion:reduce){.cell.hint{animation:none}}
.suzaku{position:absolute;top:-2px;bottom:-2px;left:50%;width:0;border-left:1px solid var(--ink);pointer-events:none}
.axis{position:absolute;font:10px/1 var(--mono);color:var(--muted);letter-spacing:.08em}
.axis.n{top:-14px;left:50%;transform:translateX(-50%)}
.axis.w{left:-14px;top:50%;transform:translateY(-50%)}
.axis.e{right:-14px;top:50%;transform:translateY(-50%)}
.axis.s{bottom:-15px;left:50%;transform:translateX(-50%);white-space:nowrap}
.where{display:flex;align-items:baseline;gap:10px;font-size:14px}
.where b{font:700 15px var(--mono);letter-spacing:.04em}
.where .cnt{margin-left:auto;font:11px var(--mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap}

.msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:0 12px}
</style>
</head>
<body>
<main id="root" aria-live="polite"></main>
<script>
(function(){
'use strict';
var DATA = 'https://sharekyoto.github.io/center/data/';
var FEED = DATA + 'feed.json';
var SITE = 'https://sharekyoto.github.io/center/';
var MAP  = 'https://mayshare.chu.jp/center/map.html';
var TELE = 'https://mayshare.chu.jp/center/tele.html';
var REC  = 'https://mayshare.chu.jp/center/record.html';   /* 記録ごとの仮の記録票（mayshare） */
var WIKI = 'http://alembic.wikidot.com/start';
var AT = '@alembicity', TAG = '#観測センター';
var FORM = 'https://mayshare.chu.jp/center/form.html';   /* 受付の用紙。アカウントの要らない口 */
var COLS = ['A','B','C','D','E','F','G','H'];               /* A が最も東 */
var KAN = ['','一','二','三','四','五','六','七','八'];

var mode = (new URLSearchParams(location.search).get('m') || '').toLowerCase();
var root = document.getElementById('root');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function xIntent(t){ return 'https://x.com/intent/post?text=' + encodeURIComponent(t); }
function xQuote(u,t){ return 'https://x.com/intent/post?text=' + encodeURIComponent(t) + '&url=' + encodeURIComponent(u); }
function imgUrl(s){ if(!s) return ''; if(/^https?:/.test(s)) return s; if(/^data\//.test(s)) return SITE + s; return DATA + s.replace(/^\.?\//,''); }
function isX(u){ return /^https:\/\/(x|twitter)\.com\//.test(u || ''); }
function head(coord){ return String(coord || '').split('/')[1] || ''; }
function cellOf(coord){ var m = /^([A-H])([1-8])(.*)$/i.exec(head(coord)); return m ? {code:m[1].toUpperCase()+m[2], fine:m[3] || ''} : null; }
function heian(code){ var m = /^([A-H])([1-8])$/.exec(code || ''); if(!m) return ''; var i = COLS.indexOf(m[1]); return (i < 4 ? '左京' : '右京') + KAN[+m[2]] + '条' + KAN[i < 4 ? 4 - i : i - 3] + '坊'; }
/* 日付（JST）で決まる番号。同じ日は誰が開いても同じ題が出る */
function daySeed(){ var d = new Date(Date.now() + 9 * 3600e3); return d.getUTCFullYear() * 400 + d.getUTCMonth() * 31 + d.getUTCDate(); }
var turn = daySeed();

function card(no, label, inner){
  return '<section class="card" data-mode="' + (inner.mode || '') + '">' +
    '<div class="top"><span class="no">' + no + '</span><span>' + label + '</span>'
    + (inner.again ? '<button class="again" type="button" data-again aria-label="' + inner.again + '"><span class="agl">' + inner.again + ' </span>↻</button>' : '')
    + (inner.link ? '<a class="rec" href="' + inner.link + '" target="_top">記録</a>' : '')
    + '</div>' +
    '<h2 class="ttl">' + inner.title + '</h2>' +
    '<div class="vis">' + inner.vis + '</div>' +
    (inner.act ? '<div class="act">' + inner.act + '</div>' : '') +
  '</section>';
}
function fail(no, label, title){
  return card(no, label, {title:title, vis:'<div class="msg">回線が混み合っています。時間をおいて開き直してください。</div>',
    act:'<a class="btn sub" style="flex:1" href="' + WIKI + '" target="_top">受付へ戻る</a>'});
}
function empty(no, label, title, text){
  return card(no, label, {title:title, vis:'<div class="msg">' + text + '</div>'});
}

/* 先の観測員の記述を一つ、例として見せる（ボケての「過去のボケ」のように、書き方が一目で分かるように） */
function exampleOf(feed, r){
  var pool = (feed.records || []).filter(function(x){ return x && x !== r && (x.tx || '').trim().length >= 12; });
  if(!pool.length) return '';
  var e = pool[(turn + (r.aid ? r.aid.length : 0)) % pool.length];
  return '<div class="ex"><b>記述の例' + (e.aid ? '　' + esc(e.aid) : '') + '</b>「' + esc(e.tx.trim()) + '」</div>';
}
function recLink(r){ return r.aid ? REC + '?id=' + encodeURIComponent(r.aid) : (r.id ? REC + '?src=' + encodeURIComponent(r.id) : ''); }

/* ① 記述待ち ── 写真と座標はある。言葉が足りない ─────────────── */
function wordPool(feed){
  var all = (feed.records || []).filter(function(r){ return r && cellOf(r.coord); });
  return all.filter(function(r){ return r && r.img && r.state !== 'lost' && (isX(r.permalink) || r.aid); })
            .sort(function(a,b){ return n(a) - n(b); });
  function n(r){ return (r.words || []).length + (r.post || []).length; }
}
function placeAid(feed){ var p = placePool(feed); return p.length ? p[(turn + 3 + K.place) % p.length].aid : ''; }
function wordCard(feed, k){
  var hide = placeAid(feed);                 /* ②の答えになる写真は①に出さない */
  var pool = wordPool(feed).filter(function(r){ return !hide || r.aid !== hide; });
  if(!pool.length) return empty('01','記述待ち','この一枚に、言葉を。','記述を待つ写真は、いまありません。');
  var fewest = pool.filter(function(r){ return count(r) === count(pool[0]); });
  var r = (k === 0 ? fewest : pool)[(turn + k) % (k === 0 ? fewest.length : pool.length)];
  var c = cellOf(r.coord);
  /* 付けるタグは #観測センター ひとつだけ。引用なら元の投稿に座標が付いているので、区画タグも要らない */
  var xHref = isX(r.permalink) ? xQuote(r.permalink, '\n\n' + TAG) : xIntent('\n\n' + r.aid + ' ' + TAG);
  var ws = (r.words || []).concat(r.post || []).filter(function(w){ return w && w.tx; });
  var said = ws.length ? '<div class="said">他の観測員の記述：「' + esc(ws[ws.length - 1].tx) + '」</div>' : exampleOf(feed, r);
  var th = r.aid ? '<a class="btn sub" href="' + FORM + '?ps=' + encodeURIComponent(r.aid) + '" target="_blank" rel="noopener">用紙で書く</a>' : '';
  return card('01', '<span class="verb">書く</span>　記述待ち' + (r.aid ? '　' + esc(r.aid) : ''), {
    mode:'word', link:recLink(r),
    again:'別の写真',
    title:'この一枚に、記述を一行。',
    vis:'<img class="shot" src="' + esc(imgUrl(r.img)) + '" alt="受理された観測写真" referrerpolicy="no-referrer" loading="lazy">' +
        '<a class="slot void" href="' + xHref + '" target="_blank" rel="noopener">記述欄　未記入</a>' + said,
    act:'<a class="btn" href="' + xHref + '" target="_blank" rel="noopener">X で書く</a>' + th
  });
  function count(x){ return (x.words || []).length + (x.post || []).length; }
}

/* ② 言葉から場所へ ──────────────────────────────── */
function placePool(feed){
  var recs = (feed.records || []).filter(function(r){ return r && r.aid && cellOf(r.coord) && (r.tx || '').trim().length >= 8 && r.state !== 'lost'
      && !(r.post || []).some(function(p){ return p && p.img; }); });   /* いまの写真（照合）が届いたものは外す */
  var bare = recs.filter(function(r){ return !r.img; });             /* 写真が無い記録を先に出す */
  return bare.length ? bare : recs;
}
function placeCard(feed, k){
  var pool = placePool(feed);
  if(!pool.length) return empty('02','現状報告待ち','この記録の、いまを撮る。','いまの姿を待つ記録は、いまありません。');
  var r = pool[(turn + 3 + k) % pool.length];
  var c = cellOf(r.coord);
  var send = xIntent('\n\n' + r.aid + ' ' + TAG);
  var peek = r.img ? '<img src="' + esc(imgUrl(r.img)) + '" alt="この記述の旧写真" referrerpolicy="no-referrer" loading="lazy">' +
                     '<button class="peek" type="button" data-peek aria-pressed="false">旧写真を見る</button>' : '';
  return card('02', '<span class="verb">撮る</span>　現状報告待ち　' + esc(r.aid), {
    mode:'place', link:recLink(r),
    again: pool.length > 1 ? '別の記録' : '',
    title:'この記録の、いまを撮る。',
    vis:'<p class="quote">「' + esc(r.tx.trim()) + '」</p>' +
        '<div class="frame void"><span class="code">' + c.code + (c.fine ? '<small>' + esc(c.fine) + '</small>' : '') + '</span>' +
        '<span class="name">' + heian(c.code) + '</span>' + peek + '</div>' +
        '<div class="ex"><b>報告の例</b>記録どおりなら同じ角度で一枚。違っていたら、どこが違うかを一行添えて。</div>',
    act:'<a class="btn" href="' + send + '" target="_blank" rel="noopener">撮って送る</a>' +
        '<a class="btn sub" href="' + MAP + '#KYOTO/' + c.code + '" target="_top">盤で見る</a>'
  });
}

/* ③ 座標待ち ── 写真はある。どこなのかが決まっていない ─────────── */
function wherePool(feed){
  var all = (feed.drifting || []).concat((feed.records || []).filter(function(r){ return r && !cellOf(r.coord); }));
  return all.filter(function(r){ return r && r.img && r.state !== 'lost' && isX(r.permalink); });
}
function statusId(r){ var m = /status\/(\d+)/.exec(r.permalink || ''); return m ? m[1] : String(r.id || '').replace(/^x:/, ''); }
function whereCard(feed, k){
  var pool = wherePool(feed);
  if(!pool.length) return empty('03','座標待ち','この一枚は、どこか。','座標を待つ写真は、いまありません。');
  var r = pool[(turn + k) % pool.length];
  var reply = 'https://x.com/intent/post?in_reply_to=' + encodeURIComponent(statusId(r)) + '&text=' + encodeURIComponent('\n\n' + TAG);
  return card('03', '<span class="verb">探す</span>　座標待ち' + (r.aid ? '　' + esc(r.aid) : ''), {
    mode:'where', link:recLink(r),
    again: pool.length > 1 ? '別の写真' : '',
    title:'この一枚は、どこか。',
    vis:'<img class="shot" src="' + esc(imgUrl(r.img)) + '" alt="座標の決まっていない観測写真" referrerpolicy="no-referrer" loading="lazy">' +
        '<a class="slot void" href="' + reply + '" target="_blank" rel="noopener">座標欄　未記入</a>' +
        '<div class="ex"><b>答え方の例</b>「市場裏の錆びた階段の下。<br>場所：E6」区画が分からなければ、場所：のあとに町名でも。</div>',
    act:'<a class="btn" href="' + reply + '" target="_blank" rel="noopener">X で答える</a>' +
        '<a class="btn sub" href="' + TELE + '" target="_top">窓で探す</a>'
  });
}

/* ④ 空白の区画 ─────────────────────────────────── */
function blankCard(feed){
  var seen = {};
  (feed.records || []).forEach(function(r){ var c = cellOf(r && r.coord); if(c) seen[c.code] = (seen[c.code] || 0) + 1; });
  var codes = [], near = [];
  for(var row = 1; row <= 8; row++) for(var col = 8; col >= 1; col--) codes.push(COLS[col - 1] + row);   /* 西→東で並べる */
  codes.forEach(function(code){
    if(seen[code]) return;
    var ci = COLS.indexOf(code[0]), ri = +code[1];
    for(var dc = -1; dc <= 1; dc++) for(var dr = -1; dr <= 1; dr++){
      var cc = COLS[ci + dc], rr = ri + dr;
      if(cc && rr >= 1 && rr <= 8 && seen[cc + rr]){ near.push(code); return; }
    }
  });
  var open = codes.filter(function(c){ return !seen[c]; });
  var base = near.length ? near : open;
  var pick = base.length ? base[turn % base.length] : codes[0];
  var n = Object.keys(seen).length;
  var cells = codes.map(function(code){
    var s = seen[code];
    return '<button type="button" class="cell' + (s ? ' seen' : '') + (code === pick ? ' pick hint' : '') + '" data-cell="' + code + '" aria-label="' + code + ' ' + heian(code) + (s ? ' 観測済' : ' 未観測') + '"></button>';
  }).join('');
  return card('04', '未観測区画', {
    mode:'blank',
    title: open.length ? 'まだ誰も観測していない区画。' : '全区画の観測が済んでいる。',
    vis:'<div class="gridwrap"><div class="board" data-board><span class="axis n">北</span><span class="axis w">西</span><span class="axis e">東</span>' +
        '<div class="grid">' + cells + '</div><span class="suzaku"></span><span class="axis s">朱雀大路</span></div></div>' +
        '<div class="where"><b data-code>' + pick + '</b><span data-name>' + heian(pick) + '</span><span class="cnt">観測済 ' + n + ' / 64</span></div>',
    act:'<a class="btn" data-go href="' + MAP + '#KYOTO/' + pick + '" target="_top">この区画へ赴く</a>'
  });
}
function fitBoards(){
  [].forEach.call(document.querySelectorAll('[data-board]'), function(b){
    var w = b.parentNode, s = Math.max(120, Math.min(w.clientWidth - 34, w.clientHeight - 36));
    b.style.width = s + 'px'; b.style.height = s + 'px';
  });
}

/* 地誌の索引 ── 64 区画の年表。ひらかれた区画は実線、まだの区画は破線 ─── */
var WIKIROOT = 'http://alembic.wikidot.com/';
var CHISHI = { E6:'chishi:kyoto-e6' };            /* 地誌がひらかれている区画。増えたら足す */
var ENCLAVE = [{ code:'T8', name:'飛地六層', page:'chishi:kyoto-t8' }];   /* 盤の外 */
function atlasCard(feed){
  var seen = {};
  (feed.records || []).forEach(function(r){ var c = cellOf(r && r.coord); if(c) seen[c.code] = (seen[c.code] || 0) + 1; });
  var codes = [];
  for(var row = 1; row <= 8; row++) for(var col = 8; col >= 1; col--) codes.push(COLS[col - 1] + row);
  var cells = codes.map(function(code){
    var open = CHISHI[code], n = seen[code] || 0;
    var href = open ? WIKIROOT + open : MAP + '#KYOTO/' + code;
    return '<a class="cell' + (open ? ' seen' : '') + '" href="' + href + '" target="_top" title="' + code + ' ' + heian(code) + (open ? '（地誌あり）' : '（未開区）') + '" aria-label="' + code + ' ' + heian(code) + (open ? ' 地誌をひらく' : ' 盤でひらく') + '">'
         + '<span class="cc">' + code + '</span>' + (n ? '<span class="cn">' + n + '</span>' : '') + '</a>';
  }).join('');
  var nOpen = Object.keys(CHISHI).length;
  return card('地誌', '区画の年表', {
    mode:'atlas',
    title:'64 区画のうち、' + nOpen + ' 区画がひらかれている。',
    vis:'<div class="gridwrap"><div class="board" data-board><span class="axis n">北</span><span class="axis w">西</span><span class="axis e">東</span>' +
        '<div class="grid">' + cells + '</div><span class="suzaku"></span><span class="axis s">朱雀大路</span></div></div>' +
        '<div class="where"><span>実線の区画は年表へ、破線の区画は盤へ。</span>' +
        ENCLAVE.map(function(e){ return '<a class="cnt" href="' + WIKIROOT + e.page + '" target="_top">盤の外：' + e.code + ' ' + e.name + '</a>'; }).join('') + '</div>'
  });
}

/* 描く ───────────────────────────────────────────── */
var FEEDDATA = null, K = {word:0, place:0, where:0};
function draw(){
  var f = FEEDDATA, out = '';
  var want = mode ? [mode] : ['word','place','where','blank'];
  want.forEach(function(m){
    if(m === 'word')  out += f ? wordCard(f, K.word)   : fail('01','記述待ち','この一枚に、言葉を。');
    if(m === 'place') out += f ? placeCard(f, K.place) : fail('02','現状報告待ち','この記録の、いまを撮る。');
    if(m === 'where') out += f ? whereCard(f, K.where) : fail('03','座標待ち','この一枚は、どこか。');
    if(m === 'blank') out += f ? blankCard(f)          : fail('04','未観測区画','まだ誰も観測していない区画。');
    if(m === 'atlas') out += f ? atlasCard(f)          : fail('地誌','区画の年表','64 区画の年表。');
  });
  root.innerHTML = out;
  fitBoards();
}
root.addEventListener('click', function(e){
  var t = e.target.closest('[data-again],[data-peek],[data-cell]');
  if(!t) return;
  var sec = t.closest('.card');
  if(t.hasAttribute('data-again')){
    var which = sec.getAttribute('data-mode') || 'word';
    K[which] = (K[which] || 0) + 1;
    var tmp = document.createElement('div');
    tmp.innerHTML = which === 'where' ? whereCard(FEEDDATA, K.where)
                  : which === 'place' ? placeCard(FEEDDATA, K.place)
                  : wordCard(FEEDDATA, K.word);
    sec.replaceWith(tmp.firstChild);
    return;
  }
  if(t.hasAttribute('data-peek')){
    var fr = t.closest('.frame'), on = !fr.classList.contains('open');
    fr.classList.toggle('open', on); fr.classList.toggle('void', !on);
    t.setAttribute('aria-pressed', on ? 'true' : 'false');
    t.textContent = on ? '閉じる' : '旧写真を見る';
    return;
  }
  if(t.hasAttribute('data-cell')){
    var code = t.getAttribute('data-cell');
    [].forEach.call(sec.querySelectorAll('.cell.pick'), function(c){ c.classList.remove('pick','hint'); });
    t.classList.add('pick');
    sec.querySelector('[data-code]').textContent = code;
    sec.querySelector('[data-name]').textContent = heian(code);
    var go = sec.querySelector('[data-go]');
    go.href = MAP + '#KYOTO/' + code;
    go.textContent = t.classList.contains('seen') ? 'この区画の記録を見る' : 'この区画へ赴く';
  }
});
window.addEventListener('resize', fitBoards);
if(!mode) document.body.classList.add('solo');

root.innerHTML = '<div class="msg" style="height:100vh">回付を待っています</div>';
fetch(FEED, {cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(j){ FEEDDATA = j; draw(); })
  .catch(function(){ FEEDDATA = null; draw(); });
})();
</script>
